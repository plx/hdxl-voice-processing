name: Spectral shape benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 3'
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/HDXLVoiceProcessing/SpectralProducts/**'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Sources/HDXLVoiceProcessing/Fourier/**'
      - 'Sources/HDXLVoiceProcessing/SpectralShape/**'
      - 'Sources/HDXLVoiceProcessing/Levels/LevelFilter.swift'
      - 'Sources/HDXLVoiceProcessing/Masks/**'
      - 'Sources/HDXLVoiceProcessing/Conditioning/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Benchmarks/Package.swift'
      - 'Benchmarks/Package.resolved'
      - 'Benchmarks/Sources/SpectralShapeWorkload/**'
      - 'Benchmarks/Sources/SpectralShapeWorkloadCheck/**'
      - 'Benchmarks/Benchmarks/SpectralShapeBenchmarks/**'
      - 'Configuration/build.json'
      - 'Tools/ci.py'
      - 'Tools/SpectralProducts/**'
      - 'Tools/SpectralShape/**'
      - 'Tools/Tests/test_spectral_shape*'
      - 'Tools/Tests/test_spectral_products*'
      - 'Tools/benchmark.py'
      - 'Tools/Performance/records.py'
      - '.github/workflows/spectral-shape-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: spectral-shape-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Spectral shape timing and allocations / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Timing without allocator instrumentation
        run: python3 Tools/SpectralShape/benchmark.py timing
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/SpectralShape/benchmark.py allocation
      - name: Retain descriptor distributions, throughput and incremental cost
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spectral-shape-benchmarks-${{ github.run_attempt }}
          path: Benchmarks/.build/artifacts/spectral-shape-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Pulse benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 4'
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/Pulses/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Benchmarks/**'
      - 'Tools/Pulses/benchmark.py'
      - 'Tools/Pulses/stage_benchmark.py'
      - 'Tools/PulseStageProbe/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Pulses/**'
      - 'Tools/Tests/test_pulse_stage_benchmark.py'
      - 'Package.swift'
      - 'Tools/Tests/test_pulse_benchmark.py'
      - 'Tools/benchmark.py'
      - '.github/workflows/pulse-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: pulse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Pulse / ${{ matrix.shard }} / Xcode 27.0
    strategy:
      fail-fast: false
      matrix:
        shard: [steady16000, steady44100, steady48000, stress, vowel, export]
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Timing without allocator instrumentation
        run: python3 Tools/Pulses/benchmark.py timing --shard "${{ matrix.shard }}"
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/Pulses/benchmark.py allocation --shard "${{ matrix.shard }}"
      - name: Retain host Pulse evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-benchmarks-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            Benchmarks/.build/artifacts/pulse-*/*.json
            Benchmarks/.build/artifacts/pulse-*/*.json.gz
            Benchmarks/.build/artifacts/pulse-*/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  stages:
    name: Pulse internal stages / ${{ matrix.shard }} / Xcode 27.0
    strategy:
      fail-fast: false
      matrix:
        shard: [steady16000, steady44100, steady48000, stress, vowel]
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Paired worker stage measurements
        run: python3 Tools/Pulses/stage_benchmark.py --shard "${{ matrix.shard }}"
      - name: Retain stage timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-stages-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .build/artifacts/pulse-stages-*/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Shimmer benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 4'
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/Shimmer/**'
      - 'Sources/HDXLVoiceProcessing/Pulses/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Benchmarks/**'
      - 'Tools/Shimmer/benchmark.py'
      - 'Tools/Shimmer/performance_*.py'
      - 'Tools/Shimmer/**'
      - 'Tools/Reference/**'
      - 'Tools/Tests/test_shimmer_performance.py'
      - 'Tools/benchmark.py'
      - 'Tools/ci.py'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Pulses/**'
      - 'Configuration/build.json'
      - 'Configuration/benchmark.json'
      - 'Configuration/provenance.json'
      - 'Package.swift'
      - '.github/workflows/shimmer-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: shimmer-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Shimmer / ${{ matrix.shard }} / Xcode 27.0
    strategy:
      fail-fast: false
      matrix:
        shard: [duration250, duration1000, duration3000, duration10000, pcm]
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Independent performance equations and receipt rejection checks
        run: python3 -m unittest discover -s Tools/Tests -p 'test_shimmer_performance.py'
      - name: Timing without allocator instrumentation
        run: python3 Tools/Shimmer/benchmark.py timing --shard "${{ matrix.shard }}"
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/Shimmer/benchmark.py allocation --shard "${{ matrix.shard }}"
      - name: Retain host shimmer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shimmer-benchmarks-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            Benchmarks/.build/artifacts/shimmer-*/*.json
            Benchmarks/.build/artifacts/shimmer-*/*.json.gz
            Benchmarks/.build/artifacts/shimmer-*/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Visualization evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/**'
      - 'Sources/HDXLVoiceProcessingVisualization/**'
      - 'Tests/HDXLVoiceProcessingVisualizationTests/**'
      - 'Examples/VisualizationConsumer/**'
      - 'Tools/Visualization/**'
      - 'Tools/Tests/test_visualization*.py'
      - 'Tools/ci.py'
      - 'Package.swift'
      - 'Configuration/**'
      - '.github/workflows/visualization-evidence.yml'

permissions:
  contents: read

concurrency:
  group: visualization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Visualization adapters and previews / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Evidence controls and capture-free preview renders
        run: |
          python3 -m unittest discover -s Tools/Tests -p 'test_visualization*.py'
          mkdir -p .build/visualization-previews
          HDXL_VISUALIZATION_PREVIEW_OUTPUT=.build/visualization-previews swift test --filter HDXLVoiceProcessingVisualizationTests --xunit-output .build/visualization-previews/tests.xml
      - name: Fresh-process construction and publication
        run: python3 Tools/Visualization/benchmark.py --output .build/visualization-evidence
      - name: Retain synthetic visualization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visualization-evidence-${{ github.run_attempt }}
          path: |
            .build/visualization-previews/*.png
            .build/visualization-previews/*.xml
            .build/visualization-evidence/*.json
            .build/visualization-evidence/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

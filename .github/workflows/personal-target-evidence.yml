name: Personal target evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/**'
      - 'Examples/PersonalTargetWorkflow/**'
      - 'Tools/PersonalTargets/**'
      - 'Tools/Reference/**'
      - 'Tools/YIN/oracle.py'
      - 'Tools/Tests/test_personal_target*.py'
      - 'Tests/HDXLVoiceProcessingTests/PersonalTarget*.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/PersonalTargets/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Calibration/**'
      - 'Configuration/provenance.json'
      - '.github/workflows/personal-target-evidence.yml'

permissions:
  contents: read

concurrency:
  group: personal-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Personal target fitting and memory / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify independent fixtures and provenance
        run: |
          python3 Tools/verify-provenance.py
          python3 Tools/PersonalTargets/profile_reference.py verify --directory Tests/HDXLVoiceProcessingTests/Fixtures/PersonalTargets/Profile
          python3 Tools/PersonalTargets/fitting_reference.py verify --path Tests/HDXLVoiceProcessingTests/Fixtures/PersonalTargets/fitting-reference.json
      - name: Exact profile checks, public API, maximum capacity and memory
        run: python3 Tools/PersonalTargets/evidence.py --output .build/personal-target-evidence
      - name: Feedback update rates, bounded observers and diagnostic mode parity
        run: python3 Tools/PersonalTargets/feedback.py --output .build/personal-feedback-evidence
      - name: Retain synthetic target evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-target-evidence-${{ github.run_attempt }}
          path: |
            .build/personal-target-evidence/**/*.json
            .build/personal-target-evidence/*.log
            .build/personal-target-evidence/*.xml
            .build/personal-feedback-evidence/*.json
            .build/personal-feedback-evidence/*.log
            .build/personal-feedback-evidence/*.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

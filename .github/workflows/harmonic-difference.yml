name: Harmonic difference benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 3'
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/HDXLVoiceProcessing/Harmonics/**'
      - 'Sources/HDXLVoiceProcessing/Formants/**'
      - 'Sources/HDXLVoiceProcessing/YIN/**'
      - 'Sources/HDXLVoiceProcessing/Conditioning/**'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Sources/HDXLVoiceProcessing/Fourier/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Sources/HDXLVoiceProcessing/Cepstrum/CepstralInputConversion.swift'
      - 'Configuration/provenance.json'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Harmonics/**'
      - 'Tests/HDXLVoiceProcessingTests/HarmonicDifferenceTests.swift'
      - 'Tools/Reference/toolchain.json'
      - 'Tools/Reference/setup.py'
      - 'Benchmarks/Package.swift'
      - 'Benchmarks/Package.resolved'
      - 'Benchmarks/Sources/HarmonicWorkload/**'
      - 'Benchmarks/Sources/HarmonicWorkloadCheck/**'
      - 'Benchmarks/Benchmarks/HarmonicBenchmarks/**'
      - 'Configuration/build.json'
      - 'Tools/ci.py'
      - 'Tools/SpectralProducts/**'
      - 'Tools/Harmonics/**'
      - 'Tools/Tests/test_harmonics*'
      - 'Tools/Tests/test_spectral_products*'
      - 'Tools/benchmark.py'
      - 'Tools/Performance/records.py'
      - '.github/workflows/harmonic-difference.yml'

permissions:
  contents: read

concurrency:
  group: harmonic-difference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Harmonic difference timing and allocations / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Reproduce filtered mixtures and pinned Praat harmonic bins
        run: |
          python3 Tools/Reference/setup.py
          python3 Tools/Harmonics/reference.py --executable .build/reference-tool/7.0.02/Praat.app/Contents/MacOS/Praat
      - name: Timing without allocator instrumentation
        run: python3 Tools/Harmonics/benchmark.py timing
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/Harmonics/benchmark.py allocation
      - name: Retain harmonic stage distributions, allocations and throughput
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmonic-difference-benchmarks-${{ github.run_attempt }}
          path: Benchmarks/.build/artifacts/harmonic-difference-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: SWIPE-prime benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 3'
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/SWIPEPrime/**'
      - 'Sources/HDXLVoiceProcessing/YIN/**'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Sources/HDXLVoiceProcessing/Fourier/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Benchmarks/**'
      - 'Tools/SWIPE/*.py'
      - 'Tools/YIN/oracle.py'
      - 'Tools/Reference/common.py'
      - 'Tools/Tests/test_swipe*.py'
      - 'Tools/benchmark.py'
      - 'Tools/ci.py'
      - 'Configuration/build.json'
      - '.github/workflows/swipe-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: swipe-prime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: SWIPE-prime / ${{ matrix.shard }} / Xcode 27.0
    strategy:
      fail-fast: false
      matrix:
        shard:
          - rate16000-float32
          - rate16000-float64
          - rate44100-float32
          - rate44100-float64
          - rate48000-float32
          - rate48000-float64
          - MaximumGeometry
          - Silence
          - Noise
          - OwnedDiagnostics
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Timing without allocator instrumentation
        run: python3 Tools/SWIPE/benchmark.py timing --shard "${{ matrix.shard }}"
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/SWIPE/benchmark.py allocation --shard "${{ matrix.shard }}"
      - name: Retain paired workload and oracle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swipe-prime-benchmarks-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            Benchmarks/.build/artifacts/swipe-prime-*/*.json
            Benchmarks/.build/artifacts/swipe-prime-*/*.json.gz
            Benchmarks/.build/artifacts/swipe-prime-*/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: watchOS feasibility probe

on:
  pull_request:
    paths: &watch_paths
      - "Examples/WatchFeasibilityProbe/**"
      - "Tools/Watch/**"
      - "Tools/Equivalence/**"
      - "Benchmarks/Portable/**"
      - "Sources/HDXLVoiceProcessing/**"
      - "Package.swift"
      - ".github/workflows/watch-feasibility.yml"
  push:
    branches: [main]
    paths: *watch_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: watchOS 27 build and recorded-segment replay
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Build both watch destinations and run synthetic replay
        run: python3 Tools/Watch/probe.py --replay --install-runtime --output .build/watch-evidence/result.json
      - name: Retain compile and Simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-feasibility-${{ github.run_attempt }}
          path: .build/watch-evidence/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

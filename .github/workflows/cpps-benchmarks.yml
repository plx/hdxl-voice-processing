name: CPPS benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '41 12 * * 3'
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/CPPS/**'
      - 'Sources/HDXLVoiceProcessing/CPP/**'
      - 'Sources/HDXLVoiceProcessing/Masks/**'
      - 'Sources/HDXLVoiceProcessing/Cepstrum/**'
      - 'Sources/HDXLVoiceProcessing/Conditioning/**'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Sources/HDXLVoiceProcessing/Fourier/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Benchmarks/**'
      - 'Tools/CPPS/benchmark.py'
      - 'Tools/benchmark.py'
      - '.github/workflows/cpps-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: cpps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: CPPS / ${{ matrix.shard }} / Xcode 27.0
    strategy:
      fail-fast: false
      matrix:
        shard: [h2-w1, h2-w3, h2-w5, h5-w1, h5-w3, h5-w5, h10-w1, h10-w3, h10-w5, h30-w1, h30-w3, h30-w5, variants]
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Timing without allocator instrumentation
        run: python3 Tools/CPPS/benchmark.py timing --shard "${{ matrix.shard }}"
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/CPPS/benchmark.py allocation --shard "${{ matrix.shard }}"
      - name: Retain host cpps evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpps-benchmarks-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            Benchmarks/.build/artifacts/cpps-*/*.json
            Benchmarks/.build/artifacts/cpps-*/*.json.gz
            Benchmarks/.build/artifacts/cpps-*/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

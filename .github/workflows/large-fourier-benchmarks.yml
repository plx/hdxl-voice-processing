name: Large Fourier benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '57 10 * * 3'
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/Fourier/**'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Benchmarks/**'
      - 'Tools/Fourier/large_benchmark.py'
      - 'Tools/benchmark.py'
      - 'Tools/ci.py'
      - 'Configuration/build.json'
      - 'Package.swift'
      - '.github/workflows/large-fourier-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: fourier-large-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Large Fourier timing and allocations / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Timing without allocator instrumentation
        run: python3 Tools/Fourier/large_benchmark.py timing
      - name: Allocation diagnostics with positive controls
        run: python3 Tools/Fourier/large_benchmark.py allocation
      - name: Retain host large Fourier evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fourier-large-benchmarks-${{ github.run_attempt }}
          path: |
            Benchmarks/.build/artifacts/fourier-large-*/*.json
            Benchmarks/.build/artifacts/fourier-large-*/*.json.gz
            Benchmarks/.build/artifacts/fourier-large-*/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Calibration workflow evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/**'
      - 'Sources/HDXLVoiceProcessingAudio/**'
      - 'Examples/CalibrationWorkflow/**'
      - 'Tools/Calibration/**'
      - 'Tools/Tests/test_calibration*.py'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Calibration/**'
      - 'Configuration/provenance.json'
      - '.github/workflows/calibration-evidence.yml'

permissions:
  contents: read

concurrency:
  group: calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Calibration workflow and memory / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify generated inputs and provenance
        run: |
          python3 Tools/verify-provenance.py
          python3 Tools/Calibration/generate.py verify --directory Tests/HDXLVoiceProcessingTests/Fixtures/Calibration
      - name: Native workflow, import capacity and repeated file analysis
        run: python3 Tools/Calibration/evidence.py --output .build/calibration-evidence
      - name: Retain synthetic workflow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-evidence-${{ github.run_attempt }}
          path: |
            .build/calibration-evidence/**/*.json
            .build/calibration-evidence/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Algorithm equivalence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/**'
      - 'Benchmarks/Portable/**'
      - 'Tools/Equivalence/**'
      - 'Tools/AlgorithmSuite/prepare.py'
      - 'Tools/Performance/verify_portable.py'
      - 'Tools/Capture/ios_host.py'
      - 'Tools/Reference/common.py'
      - 'Tools/Corpus/**'
      - 'Tools/ci.py'
      - 'Configuration/build.json'
      - 'Package.swift'
      - '.github/workflows/algorithm-equivalence.yml'

permissions:
  contents: read

concurrency:
  group: algorithm-equivalence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: PCM equivalence / ${{ matrix.group }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [synthetic, corpus, edges, duration]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Compare whole and partitioned PCM on macOS and iOS Simulator
        run: python3 Tools/Equivalence/run.py .build/equivalence-results --group "$GROUP" --install-runtime
      - name: Retain per-fixture results and platform identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcm-equivalence-${{ matrix.group }}-${{ github.run_attempt }}
          path: .build/equivalence-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

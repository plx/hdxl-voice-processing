name: DSP kernel benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '33 12 * * 3'
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/HDXLVoiceProcessing/**'
      - 'Benchmarks/Package.swift'
      - 'Benchmarks/Package.resolved'
      - 'Benchmarks/Sources/FramingWorkload/**'
      - 'Benchmarks/Sources/KernelWorkload/**'
      - 'Benchmarks/Sources/KernelWorkloadCheck/**'
      - 'Benchmarks/Benchmarks/DSPKernelBenchmarks/**'
      - 'Tools/Kernels/**'
      - 'Configuration/build.json'
      - 'Tools/ci.py'
      - 'Tools/benchmark.py'
      - 'Tools/Performance/records.py'
      - 'Tools/Tests/test_kernel_benchmark.py'
      - '.github/workflows/kernel-benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: kernels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: DSP kernel timing and allocations / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify numerical parity with the benchmark access trait
        run: |
          mkdir -p Benchmarks/.build/artifacts/kernels
          swift test -c release --traits KernelBenchmarkAccess --parallel --xunit-output Benchmarks/.build/artifacts/kernels/kernel-parity.xml
      - name: Calibrate, verify and measure the paired release matrix
        run: python3 Tools/Kernels/benchmark.py
      - name: Retain workload records, distributions and normalized table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsp-kernel-benchmarks-${{ github.run_attempt }}
          path: Benchmarks/.build/artifacts/kernels/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

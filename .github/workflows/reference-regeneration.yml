name: Reference regeneration

on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * 2'
  pull_request:
    paths:
      - 'Tools/Reference/**'
      - 'Tools/Cepstrum/**'
      - 'Tools/CPP/**'
      - 'Tools/CPPS/**'
      - 'Tools/YIN/**'
      - 'Tools/Tests/test_yin*'
      - 'Sources/HDXLVoiceProcessing/YIN/**'
      - 'Tests/HDXLVoiceProcessingTests/YIN*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/YIN/**'
      - 'Tools/Masks/**'
      - 'Sources/HDXLVoiceProcessing/Masks/**'
      - 'Tests/HDXLVoiceProcessingTests/LTSF*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Mask*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/EnergyEligibilityTests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Masks/**'
      - 'Sources/HDXLVoiceProcessing/CPP/**'
      - 'Sources/HDXLVoiceProcessing/CPPS/**'
      - 'Tests/HDXLVoiceProcessingTests/CPP*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/CPP/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/CPPS/**'
      - 'Sources/HDXLVoiceProcessing/Cepstrum/**'
      - 'Tests/HDXLVoiceProcessingTests/Cepstrum*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Cepstrum/**'
      - 'Tools/Levels/reference.py'
      - 'Sources/HDXLVoiceProcessing/Levels/**'
      - 'Tests/HDXLVoiceProcessingTests/Level*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Levels/**'
      - 'Tools/Conditioning/reference.py'
      - 'Tools/Conditioning/reference.praat'
      - 'Sources/HDXLVoiceProcessing/Conditioning/**'
      - 'Tests/HDXLVoiceProcessingTests/ConditioningReferenceTests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Conditioning/**'
      - 'Tools/Framing/reference.py'
      - 'Tools/Framing/gaussian.praat'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Framing/**'
      - 'Tests/HDXLVoiceProcessingTests/WindowTests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Reference/**'
      - 'Tests/HDXLVoiceProcessingTests/ReferenceFixtureTests.swift'
      - '.github/workflows/reference-regeneration.yml'

permissions:
  contents: read

concurrency:
  group: references-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Pinned references / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify offline references
        run: python3 Tools/Reference/verify.py
      - name: Acquire reference and compare repeated runs
        run: python3 Tools/Reference/benchmark.py --output .build/reference-evidence --trials 3
      - name: Compare pinned Gaussian coefficients
        run: |
          set -o pipefail
          python3 Tools/Framing/reference.py .build/reference-tool/7.0.02/Praat.app/Contents/MacOS/Praat | tee .build/reference-evidence/gaussian.log
      - name: Compare pinned conditioning vectors
        run: |
          set -o pipefail
          python3 Tools/Conditioning/reference.py | tee .build/reference-evidence/conditioning.log
          cp Tests/HDXLVoiceProcessingTests/Fixtures/Conditioning/praat.json .build/reference-evidence/conditioning-reference.json
      - name: Compare pinned K-weighting coefficients and independent Decimal vectors
        run: |
          set -o pipefail
          python3 Tools/Levels/reference.py acquire
          python3 Tools/Levels/reference.py verify | tee .build/reference-evidence/levels.log
          cp Tests/HDXLVoiceProcessingTests/Fixtures/Levels/k-weighting.json .build/reference-evidence/levels-reference.json
      - name: Regenerate and compare pinned cepstral intermediates
        run: |
          set -o pipefail
          python3 Tools/Cepstrum/verify.py | tee .build/reference-evidence/cepstrum-committed.log
          python3 Tools/Cepstrum/reference.py --output .build/reference-evidence/cepstrum | tee .build/reference-evidence/cepstrum-generation.log
          python3 Tools/Cepstrum/verify.py --directory .build/reference-evidence/cepstrum | tee .build/reference-evidence/cepstrum-candidate.log
          cmp Tests/HDXLVoiceProcessingTests/Fixtures/Cepstrum/manifest.json .build/reference-evidence/cepstrum/manifest.json
          HDXL_CEPSTRUM_REFERENCE_DIRECTORY="$PWD/.build/reference-evidence/cepstrum" \
          HDXL_CEPSTRUM_REFERENCE_REPORT="$PWD/.build/reference-evidence/cepstrum-native.json" \
          swift test --filter cepstrumExternalStageReferences | tee .build/reference-evidence/cepstrum-native.log
          python3 -c 'import json; rows=json.load(open(".build/reference-evidence/cepstrum-native.json")); assert len(rows)==2898'
      - name: Regenerate and compare CPP peaks and background fits
        run: |
          set -o pipefail
          python3 Tools/CPP/verify.py | tee .build/reference-evidence/cpp-committed.log
          python3 Tools/CPP/reference.py --output .build/reference-evidence/cpp | tee .build/reference-evidence/cpp-generation.log
          python3 Tools/CPP/verify.py --directory .build/reference-evidence/cpp | tee .build/reference-evidence/cpp-candidate.log
          cmp Tests/HDXLVoiceProcessingTests/Fixtures/CPP/manifest.json .build/reference-evidence/cpp/manifest.json
          HDXL_CPP_REFERENCE_DIRECTORY="$PWD/.build/reference-evidence/cpp" \
          HDXL_CPP_REFERENCE_REPORT="$PWD/.build/reference-evidence/cpp-native.json" \
          swift test --filter cppExternalReferences | tee .build/reference-evidence/cpp-native.log
          python3 -c 'import json; r=json.load(open(".build/reference-evidence/cpp-native.json")); assert r["cases"]==216 and len(r["comparisons"])==1414 and r["knownReferenceExceptions"]==32'
          HDXL_CPP_REFERENCE_DIRECTORY="$PWD/.build/reference-evidence/cpp" \
          HDXL_CPP_PCM_REFERENCE_REPORT="$PWD/.build/reference-evidence/cpp-pcm-native.json" \
          swift test --filter cppWholePCMExternalSpeechReferences | tee .build/reference-evidence/cpp-pcm-native.log
          python3 -c 'import json; r=json.load(open(".build/reference-evidence/cpp-pcm-native.json")); assert len(r)==40 and max(x["maximumBudgetFraction"] for x in r)<=1'
      - name: Regenerate and compare speech-activity masks
        run: |
          set -o pipefail
          python3 Tools/Masks/verify.py | tee .build/reference-evidence/masks-committed.log
          python3 Tools/Masks/reference.py --output .build/reference-evidence/masks | tee .build/reference-evidence/masks-generation.log
          python3 Tools/Masks/verify.py --directory .build/reference-evidence/masks | tee .build/reference-evidence/masks-candidate.log
          cmp Tests/HDXLVoiceProcessingTests/Fixtures/Masks/manifest.json .build/reference-evidence/masks/manifest.json
          HDXL_MASK_REFERENCE_DIRECTORY="$PWD/.build/reference-evidence/masks" \
          HDXL_MASK_REFERENCE_REPORT="$PWD/.build/reference-evidence/masks-native.json" \
          swift test --filter ltsfReferenceCatalog | tee .build/reference-evidence/masks-native.log
          python3 -c 'import json; r=json.load(open(".build/reference-evidence/masks-native.json"))["comparisons"]; assert len(r)==35 and sum(x["frameCount"] for x in r)==5088 and sum(x["comparedPowers"] for x in r)==103571 and max(v for x in r for v in x["maximumBudgetFractions"].values())<=1'
      - name: Regenerate and compare CPPS smoothing and acquired-region measurements
        run: |
          set -o pipefail
          python3 Tools/CPPS/verify.py | tee .build/reference-evidence/cpps-committed.log
          python3 Tools/CPPS/reference.py --output .build/reference-evidence/cpps | tee .build/reference-evidence/cpps-generation.log
          python3 Tools/CPPS/verify.py --directory .build/reference-evidence/cpps | tee .build/reference-evidence/cpps-candidate.log
          cmp Tests/HDXLVoiceProcessingTests/Fixtures/CPPS/manifest.json .build/reference-evidence/cpps/manifest.json
          HDXL_CPPS_REFERENCE_DIRECTORY="$PWD/.build/reference-evidence/cpps" \
          HDXL_CPPS_REFERENCE_REPORT="$PWD/.build/reference-evidence/cpps-native" \
          swift test -c release --filter 'cppsExternalIsolatedReferences|cppsWholePCMExternalReferences' | tee .build/reference-evidence/cpps-native.log
          python3 -c 'import json; i=json.load(open(".build/reference-evidence/cpps-native-isolated.json")); p=json.load(open(".build/reference-evidence/cpps-native-pcm.json")); assert len(i)==18 and len(p)==18; assert sum(x["frameCount"] for x in i)==222; g=[x for x in p if x["gatedWholeCPPSParity"]]; assert len(g)==17 and sum(x["frameCount"] for x in g)==12923; assert [x["name"] for x in p if not x["gatedWholeCPPSParity"]]==["speech-bl01-dropout"]; assert all(x["meetsFinalCPPSBudget"] for x in i+g); assert max(x["maximumPowerBudgetFraction"] for x in i)<=1'
      - name: Regenerate and compare YIN candidates, tracking and streamed frames
        run: |
          set -o pipefail
          python3 Tools/YIN/verify.py | tee .build/reference-evidence/yin-committed.log
          python3 Tools/YIN/reference.py --output .build/reference-evidence/yin | tee .build/reference-evidence/yin-generation.log
          python3 Tools/YIN/verify.py .build/reference-evidence/yin | tee .build/reference-evidence/yin-candidate.log
          cmp Tests/HDXLVoiceProcessingTests/Fixtures/YIN/manifest.json .build/reference-evidence/yin/manifest.json
          HDXL_YIN_REFERENCE_DIRECTORY="$PWD/.build/reference-evidence/yin" \
          HDXL_YIN_REFERENCE_REPORT="$PWD/.build/reference-evidence/yin-native.json" \
          swift test --filter yinIndependentScalarAndFFTReferences | tee .build/reference-evidence/yin-native.log
          python3 -c 'import json; r=json.load(open(".build/reference-evidence/yin-native.json")); assert len(r)==154; assert sum(x["frameCount"] for x in r)==1342; assert all(x["trackedFrameCount"]==x["frameCount"]==x["streamedFrameCount"] for x in r); assert max(x[k] for x in r for k in ("maximumDifferenceBudgetFraction","maximumCMNDBudgetFraction","maximumPeriodBudgetFraction","maximumFrequencyBudgetFraction"))<=1'
      - name: Retain reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-regeneration-${{ github.run_attempt }}
          path: |
            .build/reference-evidence/*.json
            .build/reference-evidence/*.log
            .build/reference-evidence/yin/**
            .build/reference-evidence/masks/**
            .build/reference-evidence/cepstrum/*.json
            .build/reference-evidence/cpp/*.json
            .build/reference-evidence/cpps/*.json
            .build/reference-evidence/workloads/**/reference.json
            .build/reference-evidence/workloads/**/reference.raw.txt
            .build/reference-evidence/workloads/**/execution.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: Reference regeneration

on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * 2'
  pull_request:
    paths:
      - 'Tools/Reference/**'
      - 'Tools/Levels/reference.py'
      - 'Sources/HDXLVoiceProcessing/Levels/**'
      - 'Tests/HDXLVoiceProcessingTests/Level*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Levels/**'
      - 'Tools/Conditioning/reference.py'
      - 'Tools/Conditioning/reference.praat'
      - 'Sources/HDXLVoiceProcessing/Conditioning/**'
      - 'Tests/HDXLVoiceProcessingTests/ConditioningReferenceTests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Conditioning/**'
      - 'Tools/Framing/reference.py'
      - 'Tools/Framing/gaussian.praat'
      - 'Sources/HDXLVoiceProcessing/Framing/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Framing/**'
      - 'Tests/HDXLVoiceProcessingTests/WindowTests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Reference/**'
      - 'Tests/HDXLVoiceProcessingTests/ReferenceFixtureTests.swift'
      - '.github/workflows/reference-regeneration.yml'

permissions:
  contents: read

concurrency:
  group: references-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Pinned references / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify offline references
        run: python3 Tools/Reference/verify.py
      - name: Acquire reference and compare repeated runs
        run: python3 Tools/Reference/benchmark.py --output .build/reference-evidence --trials 3
      - name: Compare pinned Gaussian coefficients
        run: |
          set -o pipefail
          python3 Tools/Framing/reference.py .build/reference-tool/7.0.02/Praat.app/Contents/MacOS/Praat | tee .build/reference-evidence/gaussian.log
      - name: Compare pinned conditioning vectors
        run: |
          set -o pipefail
          python3 Tools/Conditioning/reference.py | tee .build/reference-evidence/conditioning.log
          cp Tests/HDXLVoiceProcessingTests/Fixtures/Conditioning/praat.json .build/reference-evidence/conditioning-reference.json
      - name: Compare pinned K-weighting coefficients and independent Decimal vectors
        run: |
          set -o pipefail
          python3 Tools/Levels/reference.py acquire
          python3 Tools/Levels/reference.py verify | tee .build/reference-evidence/levels.log
          cp Tests/HDXLVoiceProcessingTests/Fixtures/Levels/k-weighting.json .build/reference-evidence/levels-reference.json
      - name: Retain original-synthetic reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-regeneration-${{ github.run_attempt }}
          path: |
            .build/reference-evidence/*.json
            .build/reference-evidence/*.log
            .build/reference-evidence/workloads/**/reference.json
            .build/reference-evidence/workloads/**/reference.raw.txt
            .build/reference-evidence/workloads/**/execution.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

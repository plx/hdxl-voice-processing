name: Jitter references

on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * 4'
  pull_request:
    paths:
      - 'Sources/HDXLVoiceProcessing/Jitter/**'
      - 'Sources/HDXLVoiceProcessing/Pulses/**'
      - 'Sources/HDXLVoiceProcessing/Contracts/**'
      - 'Sources/HDXLVoiceProcessing/Diagnostics/**'
      - 'Tests/HDXLVoiceProcessingTests/Jitter*Tests.swift'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Jitter/**'
      - 'Tests/HDXLVoiceProcessingTests/Fixtures/Pulses/**'
      - 'Tools/Jitter/**'
      - 'Tools/Reference/**'
      - 'Tools/Tests/test_jitter*.py'
      - 'Configuration/provenance.json'
      - 'Package.swift'
      - '.github/workflows/jitter-references.yml'

permissions:
  contents: read

concurrency:
  group: jitter-references-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Jitter independent equations and PCM integration / Xcode 27.0
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Verify original inputs and pinned reference
        run: |
          python3 Tools/Reference/setup.py
          python3 Tools/verify-provenance.py
          python3 Tools/Jitter/verify.py Tests/HDXLVoiceProcessingTests/Fixtures/Jitter
          python3 -m unittest discover -s Tools/Tests -p 'test_jitter*.py'
      - name: Regenerate complete independent/reference evidence
        run: |
          set -o pipefail
          mkdir -p .build/jitter-reference-evidence
          python3 Tools/Jitter/generate.py --output .build/jitter-reference-evidence/candidate | tee .build/jitter-reference-evidence/generation.log
          python3 Tools/Jitter/verify.py .build/jitter-reference-evidence/candidate --canonical Tests/HDXLVoiceProcessingTests/Fixtures/Jitter --report .build/jitter-reference-evidence/comparison.json
      - name: Native tests against canonical evidence proven identical to fresh candidates
        env:
          HDXL_JITTER_PCM_REPORT: ${{ github.workspace }}/.build/jitter-reference-evidence/native-pcm.json
        run: |
          set -o pipefail
          swift test -c release --filter jitter | tee .build/jitter-reference-evidence/native.log
      - name: Retain reproducible jitter evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jitter-references-${{ github.run_attempt }}
          path: .build/jitter-reference-evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
